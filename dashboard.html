<!DOCTYPE html>
<html>
<head>

    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="dashboard">

    <h1>Water Monitoring Dashboard</h1>

    <div class="dashboard-cards">

        <div class="dash-card">
            <h2>Water Level</h2>

            <p>
                78%
            </p>
        </div>

        <div class="dash-card">
            <h2>Tank Status</h2>

            <p>
                Normal
            </p>
        </div>

        <div class="dash-card">
            <h2>Daily Usage</h2>

            <p>
                250 Liters
            </p>
        </div>

    </div>

</div>

</body>
</html>
