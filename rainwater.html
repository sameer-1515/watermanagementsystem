    <h1>Rainwater Harvesting</h1>

    <img src="images/rainwater.png" class="details-img">

    <p>
        Rainwater harvesting is the process of collecting and storing rainwater
        for future use. It helps increase groundwater levels and reduces water scarcity.
    </p>

    <h2>Benefits</h2>

    <ul>
        <li>Reduces water bills</li>
        <li>Improves groundwater levels</li>
        <li>Useful during droughts</li>
        <li>Environment friendly</li>
    </ul>
